[package]
name = "sqlite-fs"
version = "0.1.0"
edition = "2024"
default-run = "sqlite-fs"

[workspace]
members = [
  ".",
  "minfuse",
  "minfs",
]
default-members = [
  ".",
  "minfuse",
  "minfs",
]
resolver = "3"

[dependencies]
minfuse = { path = "minfuse" }
minfs = { path = "minfs" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
